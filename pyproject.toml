[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmsat"
version = "0.1.0"
description = "Screenshot-based Football Manager squad assessment data extractor"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FMSAT contributors" }]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "PaddleOCR>=2.8.0,<3.0",
    "PySide6>=6.7.0",
    "PyYAML>=6.0.1",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
compression = ["lz4>=4.3.3", "zstandard>=0.22.0"]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.6.0",
]

[project.scripts]
fmsat = "fmsat.app.main:main"
fmsat-parser = "fmsat.cli:main"

[tool.pytest.ini_options]
testpaths = ["fmsat/tests"]
pythonpath = ["."]
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
